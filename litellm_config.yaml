model_list:
  # External free-tier route: Google Gemini
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # Local route: Ollama running as a container (note: service name, not localhost)
  - model_name: local-qwen
    litellm_params:
      model: ollama/qwen2.5:3b
      api_base: http://ollama:11434

    # --- new: Groq (fast) ---
  - model_name: groq-gpt-oss
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY

  # --- new: OpenRouter (strong free reasoner) ---
  - model_name: openrouter-free
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY

  # --- new: Mistral ---
  - model_name: mistral-14b
    litellm_params:
      model: mistral/ministral-14b-2512
      api_key: os.environ/MISTRAL_API_KEY

litellm_settings:
  drop_params: true

general_settings:
  master_key: sk-1234
  database_url: "postgresql://litellm:litellm@postgres:5432/litellm"